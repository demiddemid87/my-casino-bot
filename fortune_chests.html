<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortune Chests</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --gold: #FFD700; --text: #fff; --border: rgba(255,215,0,0.4); }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0805 url('https://i.imgur.com/8Y6wJ8k.jpeg') center/cover; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: var(--text); }
        /* Затемняющий слой для фона, чтобы игра была четче */
        body::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: -1; }
        
        .top-bar { width: 100%; max-width: 450px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; left: 0; right: 0; margin: 0 auto; z-index: 10; }
        .balance { background: rgba(0,0,0,0.7); border: 1px solid var(--border); padding: 8px 15px; border-radius: 20px; font-weight: 800; color: var(--gold); font-size: 14px; }
        .back-btn { background: rgba(0,0,0,0.7); border: 1px solid var(--border); color: var(--gold); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; text-decoration: none; }

        .game-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; position: relative; margin-top: 40px; }
        
        /* Три сундука */
        .chests-top { display: flex; justify-content: space-between; width: 100%; max-width: 320px; margin-bottom: 5px; z-index: 2; padding: 0 10px; }
        .chest { font-size: 30px; filter: drop-shadow(0 0 10px rgba(255,215,0,0.8)); animation: floatChest 2s infinite alternate; }
        .chest.green { animation-delay: 0s; }
        .chest.red { animation-delay: 0.3s; }
        .chest.purple { animation-delay: 0.6s; }
        @keyframes floatChest { from { transform: translateY(0); } to { transform: translateY(-5px); } }

        /* Золотая рамка вокруг слотов */
        .reels-frame { background: linear-gradient(180deg, #5a3a0a 0%, #d4af37 50%, #5a3a0a 100%); padding: 4px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5); }
        .reels-bg { background: #1a0f0a; border-radius: 12px; display: flex; overflow: hidden; padding: 5px; gap: 5px; }
        
        .reel-col { width: 80px; height: 240px; overflow: hidden; position: relative; border-radius: 8px; background: #111; box-shadow: inset 0 0 20px rgba(0,0,0,1); }
        .reel-strip { display: flex; flex-direction: column; }
        .symbol-box { width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        
        /* Кнопка спина */
        .controls-area { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 320px; padding: 0 10px; }
        .spin-btn { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #ffd700, #b8860b); border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,215,0,0.8), inset 0 0 10px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 32px; color: #fff; transition: 0.1s; }
        .spin-btn:active { transform: scale(0.95); box-shadow: 0 0 30px rgba(255,215,0,1); }
        .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .info-side { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .info-lbl { font-size: 10px; text-transform: uppercase; color: #aaa; font-weight: 800; }
        .info-val { font-size: 16px; font-weight: 900; color: var(--gold); }
        
        .bet-side { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .bet-controls { display: flex; align-items: center; gap: 8px; }
        .bet-btn { background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: var(--gold); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; font-weight: bold; }
        .bet-btn:active { background: rgba(255,215,0,0.2); }

        .win-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.3s; }
        .win-overlay.show { opacity: 1; }
        .win-text { font-size: 48px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px #FFD700, 0 0 40px #FFA500; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="javascript:window.close()" class="back-btn">←</a>
        <div class="balance" id="headerBalance">0.00</div>
    </div>

    <div class="game-container">
        <!-- Сундуки -->
        <div class="chests-top">
            <div class="chest green">🎁</div>
            <div class="chest red">🎁</div>
            <div class="chest purple">🎁</div>
        </div>

        <!-- Барабаны -->
        <div class="reels-frame">
            <div class="reels-bg">
                <div class="reel-col"><div class="reel-strip" id="reel0"></div></div>
                <div class="reel-col"><div class="reel-strip" id="reel1"></div></div>
                <div class="reel-col"><div class="reel-strip" id="reel2"></div></div>
            </div>
        </div>

        <!-- Кнопка и панель управления -->
        <div class="controls-area">
            <!-- Инфо слева -->
            <div class="info-side">
                <div class="info-lbl">Баланс</div>
                <div class="info-val" id="balanceDisplay">0.00</div>
            </div>

            <!-- Кнопка спина -->
            <div class="spin-btn" id="spinBtn" onclick="spin()">
                <!-- SVG для стрелочки как на скрине -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.93 6.61 2.39M21 3v6h-6"/></svg>
            </div>

            <!-- Ставка справа -->
            <div class="bet-side">
                <div class="info-lbl">Ставка</div>
                <div class="bet-controls">
                    <button class="bet-btn" onclick="changeBet(-1)">-</button>
                    <div class="info-val" id="betDisplay">10</div>
                    <button class="bet-btn" onclick="changeBet(1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-text" id="winText">+0</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = parseInt(urlParams.get('id')) || 0;
        const currency = urlParams.get('currency') || 'USD';
        
        let balance = 0;
        let currentBet = 10;

        const SYMBOLS = {
            'JOKER': '🃏', 'SEVEN': '7️⃣', 'BAR': '🏷️', 'BELL': '🔔', 'MELON': '🍉', 'GRAPE': '🫐', 'CHERRY': '🍒', 'TOKEN': '🪙'
        };
        const REEL_STRIP = ['🍒','🍉','🫐','🔔','🏷️','7️⃣','🃏'];

        function getSym() { return currency === 'UAH' ? '₴' : '$'; }

        async function loadUser() {
            try {
                const res = await fetch(`/api/user?id=${userId}&username=guest`);
                const data = await res.json();
                balance = currency === 'UAH' ? data.balance_uah : data.balance;
                updateBalanceUI();
            } catch (e) { console.log('load error', e); }
        }

        function updateBalanceUI() {
            document.getElementById('headerBalance').innerText = getSym() + balance.toFixed(2);
            document.getElementById('balanceDisplay').innerText = getSym() + balance.toFixed(2);
            document.getElementById('betDisplay').innerText = currentBet;
        }

        function changeBet(dir) {
            if (dir > 0) currentBet += 5;
            else if (currentBet > 5) currentBet -= 5;
            updateBalanceUI();
        }

        // Заполняем барабаны начальными символами
        function initReels() {
            for (let i = 0; i < 3; i++) {
                let html = '';
                for (let j = 0; j < 5; j++) {
                    const sym = REEL_STRIP[Math.floor(Math.random() * REEL_STRIP.length)];
                    html += `<div class="symbol-box">${sym}</div>`;
                }
                document.getElementById(`reel${i}`).innerHTML = html;
                document.getElementById(`reel${i}`).style.transform = 'translateY(0px)';
            }
        }

        async function spin() {
            if (balance < currentBet) { alert('Недостаточно средств!'); return; }
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            // Анимация кручения
            const spinIntervals = [];
            for (let i = 0; i < 3; i++) {
                const el = document.getElementById(`reel${i}`);
                let offset = 0;
                spinIntervals.push(setInterval(() => {
                    offset -= 10; // Скорость
                    el.style.transform = `translateY(${offset}px)`;
                    // Сброс, чтобы лента не кончалась
                    if (offset <= -160) {
                        offset = 0;
                    }
                }, 30));
            }

            const res = await fetch('/api/fortune-chests/spin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: userId, bet: currentBet, currency })
            });
            const data = await res.json();

            if (data.error) {
                for (let i = 0; i < 3; i++) clearInterval(spinIntervals[i]);
                btn.disabled = false;
                alert(data.error);
                return;
            }

            // Останавливаем через разное время для эффекта
            setTimeout(() => {
                clearInterval(spinIntervals[0]);
                // Устанавливаем финальные символы на 1-й барабан
                let html = '';
                for(let j=0;j<3;j++) html += `<div class="symbol-box">${data.reels[0][j]}</div>`;
                document.getElementById(`reel0`).innerHTML = html;
                document.getElementById(`reel0`).style.transform = 'translateY(0)';
            }, 400);

            setTimeout(() => {
                clearInterval(spinIntervals[1]);
                let html = '';
                for(let j=0;j<3;j++) html += `<div class="symbol-box">${data.reels[1][j]}</div>`;
                document.getElementById(`reel1`).innerHTML = html;
                document.getElementById(`reel1`).style.transform = 'translateY(0)';
            }, 600);

            setTimeout(() => {
                clearInterval(spinIntervals[2]);
                let html = '';
                for(let j=0;j<3;j++) html += `<div class="symbol-box">${data.reels[2][j]}</div>`;
                document.getElementById(`reel2`).innerHTML = html;
                document.getElementById(`reel2`).style.transform = 'translateY(0)';

                // Обновляем баланс
                balance = data.balance;
                updateBalanceUI();
                btn.disabled = false;

                if (data.win > 0) {
                    const overlay = document.getElementById('winOverlay');
                    const txt = document.getElementById('winText');
                    txt.innerText = '+' + getSym() + data.win.toFixed(2);
                    overlay.classList.add('show');
                    setTimeout(() => overlay.classList.remove('show'), 2500);
                }
            }, 800);
        }

        // Инициализация
        initReels();
        loadUser();
    </script>
</body>
</html>
