<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MADGEK CLUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ТЕМЫ */
        :root {
            --bg: #0a0a0e; --surface: #15151c; --border: #2a2a35;
            --text: #ffffff; --muted: #8b8b93; --accent: #FFD700; --accent-text: #000;
        }
        [data-theme="neon"] {
            --bg: #050510; --surface: #0f0f20; --border: #1a1a3a;
            --text: #e0e0ff; --muted: #6a6a8a; --accent: #00f3ff; --accent-text: #000;
        }
        [data-theme="ruby"] {
            --bg: #0f0505; --surface: #1a0a0a; --border: #3a1515;
            --text: #ffe0e0; --muted: #8a5a5a; --accent: #ff2a2a; --accent-text: #fff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif;
            padding: 15px 15px 90px; min-height: 100vh; overflow-x: hidden;
            transition: background-color 0.3s ease;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
        .logo { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--accent); }
        .balance { background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-weight: 800; color: var(--accent); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        
        /* Навигация */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
            display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border); z-index: 100;
        }
        .nav-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
        .nav-btn .icon { font-size: 22px; }
        .nav-btn.active { color: var(--accent); }

        /* Кнопки */
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-primary { background: var(--accent); color: var(--accent-text); }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        
        /* Формы */
        input, select { width: 100%; padding: 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; margin-bottom: 15px; font-family: inherit; font-size: 16px; }
        textarea { width: 100%; padding: 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; margin-bottom: 15px; font-family: inherit; font-size: 16px; height: 100px; resize: none;}

        /* История */
        .tx-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .tx-item:last-child { border-bottom: none; }
        .tx-status { font-size: 11px; color: var(--muted); }

        .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-size: 30px; color: var(--accent-text); font-weight: bold; }
        
        /* Переключатель тем */
        .theme-selector { display: flex; gap: 10px; margin-top: 10px; }
        .theme-btn { flex: 1; padding: 10px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; text-align: center; font-size: 12px; font-weight: bold; }
        .theme-btn.active { border-color: var(--text); }

        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="gold">

    <div class="header">
        <div class="logo">MADGEK</div>
        <div class="balance" id="headerBalance">$0.00</div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="view-profile">
        <div class="card" style="display: flex; align-items: center; gap: 15px;">
            <div class="avatar" id="avatarLetter">U</div>
            <div>
                <div style="font-size: 20px; font-weight: 800;" id="profName">Игрок</div>
                <div style="font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px;">VIP: <span id="profVip">Бронза</span></div>
                <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">ID: <span id="profId">0</span></div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div class="card" style="flex: 1; text-align: center; padding: 15px;">
                <div style="font-size: 11px; color: var(--muted); text-transform: uppercase;">Раундов</div>
                <div style="font-size: 20px; font-weight: bold; margin-top: 5px;" id="profRounds">0</div>
            </div>
            <div class="card" style="flex: 1; text-align: center; padding: 15px;">
                <div style="font-size: 11px; color: var(--muted); text-transform: uppercase;">Лучший выигрыш</div>
                <div style="font-size: 20px; font-weight: bold; margin-top: 5px;" id="profBest">$0.00</div>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">Смена дизайна</div>
            <div class="theme-selector">
                <div class="theme-btn active" onclick="setTheme('gold')" style="background: #FFD700; color: #000;">Gold</div>
                <div class="theme-btn" onclick="setTheme('neon')" style="background: #00f3ff; color: #000;">Neon</div>
                <div class="theme-btn" onclick="setTheme('ruby')" style="background: #ff2a2a; color: #fff;">Ruby</div>
            </div>
        </div>
    </div>

    <!-- КАССА -->
    <div id="view-cash" class="hidden">
        <div class="card" style="text-align: center;">
            <div style="font-size: 14px; color: var(--muted);">Ваш баланс</div>
            <div style="font-size: 42px; font-weight: 800; color: var(--accent); margin: 10px 0;" id="cashBalance">$0.00</div>
        </div>

        <div class="card">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 15px;">Пополнение</div>
            <input type="number" id="depAmount" value="1000" placeholder="Сумма">
            <button class="btn btn-primary" onclick="doDeposit()">Пополнить</button>
        </div>

        <div class="card">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 15px;">Вывод средств</div>
            <input type="number" id="wdAmount" value="500" placeholder="Сумма">
            <button class="btn btn-secondary" onclick="doWithdraw()">Создать заявку</button>
        </div>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="view-history" class="hidden">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">История операций</div>
        <div class="card" id="txList">
            <div style="text-align: center; color: var(--muted); padding: 20px;">Загрузка...</div>
        </div>
    </div>

    <!-- ПОДДЕРЖКА -->
    <div id="view-support" class="hidden">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">Поддержка</div>
        <div class="card">
            <p style="font-size: 13px; color: var(--muted); margin-bottom: 15px;">Опишите проблему. Сообщение придет администратору в Telegram.</p>
            <textarea id="supMessage" placeholder="Ваше сообщение..."></textarea>
            <button class="btn btn-primary" onclick="sendSupport()">Отправить</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-bar">
        <button class="nav-btn active" id="nav-profile" onclick="switchView('profile')"><span class="icon">👤</span>Профиль</button>
        <button class="nav-btn" id="nav-cash" onclick="switchView('cash')"><span class="icon">💰</span>Касса</button>
        <button class="nav-btn" id="nav-history" onclick="switchView('history')"><span class="icon">📜</span>История</button>
        <button class="nav-btn" id="nav-support" onclick="switchView('support')"><span class="icon">💬</span>Поддержка</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg) tg.expand();
        let user = tg.initDataUnsafe?.user || { id: 0, first_name: 'Игрок', username: 'guest' };
        let state = { balance: 0, total_rounds: 0, best_result: 0, total_bet: 0 };

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function loadUser() {
            try {
                const res = await fetch(`/api/user?id=${user.id}&username=${user.username}`);
                const data = await res.json();
                state.balance = data.balance; state.total_rounds = data.total_rounds; state.best_result = data.best_result;
                updateUI();
            } catch (e) { 
                state.balance = 10000; 
                updateUI(); 
            }
        }

        function updateUI() {
            const balStr = '$' + state.balance.toFixed(2);
            document.getElementById('headerBalance').innerText = balStr;
            document.getElementById('cashBalance').innerText = balStr;
            
            document.getElementById('profName').innerText = user.first_name;
            document.getElementById('profId').innerText = user.id;
            document.getElementById('avatarLetter').innerText = user.first_name.charAt(0).toUpperCase();
            document.getElementById('profRounds').innerText = state.total_rounds;
            document.getElementById('profBest').innerText = '$' + state.best_result.toFixed(2);
        }

        function switchView(view) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + view).classList.add('active');
            
            if (view === 'history') loadHistory();
        }

        async function doDeposit() {
            const amt = parseFloat(document.getElementById('depAmount').value);
            if(!amt || amt <= 0) return tg.showAlert('Введите сумму');
            
            try {
                await fetch('/api/deposit', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: user.id, amount: amt }) });
                state.balance += amt;
                updateUI();
                tg.showAlert(`✅ Баланс пополнен на $${amt}`);
            } catch(e) { tg.showAlert('Ошибка'); }
        }

        async function doWithdraw() {
            const amt = parseFloat(document.getElementById('wdAmount').value);
            if(!amt || amt <= 0) return tg.showAlert('Введите сумму');
            if(state.balance < amt) return tg.showAlert('Недостаточно средств');
            
            try {
                const res = await fetch('/api/withdraw', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: user.id, amount: amt }) });
                if(res.ok) {
                    state.balance -= amt;
                    updateUI();
                    tg.showAlert(`✅ Заявка на вывод $${amt} создана! Ожидайте.`);
                } else { tg.showAlert('Ошибка вывода'); }
            } catch(e) { tg.showAlert('Ошибка'); }
        }

        async function loadHistory() {
            const list = document.getElementById('txList');
            list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">Загрузка...</div>';
            try {
                const res = await fetch(`/api/transactions?id=${user.id}`);
                const data = await res.json();
                if(data.length === 0) {
                    list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">История пуста</div>';
                    return;
                }
                list.innerHTML = data.map(tx => {
                    const color = tx.type === 'Deposit' ? 'var(--accent)' : '#ff4444';
                    const sign = tx.type === 'Deposit' ? '+' : '-';
                    return `<div class="tx-item">
                        <div>
                            <div style="font-weight:bold;">${tx.type === 'Deposit' ? 'Пополнение' : 'Вывод'}</div>
                            <div class="tx-status">${tx.date} • ${tx.status === 'Pending' ? 'В обработке' : 'Выполнено'}</div>
                        </div>
                        <div style="color: ${color}; font-weight: bold;">${sign}$${tx.amount.toFixed(2)}</div>
                    </div>`;
                }).join('');
            } catch(e) { list.innerHTML = '<div style="text-align:center; color:var(--muted);">Ошибка загрузки</div>'; }
        }

        async function sendSupport() {
            const msg = document.getElementById('supMessage').value.trim();
            if(!msg) return tg.showAlert('Введите сообщение');
            
            try {
                await fetch('/api/support', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: user.id, username: user.username, message: msg }) });
                document.getElementById('supMessage').value = '';
                tg.showAlert('✅ Сообщение отправлено!');
            } catch(e) { tg.showAlert('Ошибка'); }
        }

        loadUser();
    </script>
</body>
</html>
